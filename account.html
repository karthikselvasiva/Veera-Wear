<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — VEERA WEAR</title>
  <meta name="description" content="Manage your VEERA WEAR account, view orders, and update your profile.">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <section class="section" id="main-section"><div class="container" style="text-align:center;padding:var(--space-16);"><p>Loading...</p></div></section>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/supabase-cdn.js"></script>
  <script src="js/supabase.js?v=3"></script>
  <script src="js/data.js?v=3"></script>
  <script src="js/auth.js?v=3"></script>
  <script src="js/cart.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initApp('', () => {
        Auth.isLoggedIn() ? renderProfile() : renderAuthForms();
      });
    });
    function renderAuthForms() {
      document.getElementById('main-section').innerHTML = `
        <div class="auth-container">
          <div class="auth-card" id="login-card">
            <h2 class="auth-card__title">Welcome Back</h2>
            <p class="auth-card__subtitle">Sign in to your VEERA WEAR account</p>
            <form onsubmit="handleLogin(event)">
              <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" id="login-email" required></div>
              <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-input" id="login-password" required></div>
              <button type="submit" class="btn btn--primary btn--full btn--lg">Sign In</button>
            </form>
            <p class="auth-toggle">Don't have an account? <a href="#" onclick="toggleAuth(event,'register')">Create one</a></p>
          </div>
          <div class="auth-card" id="register-card" style="display:none;">
            <h2 class="auth-card__title">Create Account</h2>
            <p class="auth-card__subtitle">Join the VEERA WEAR community</p>
            <form onsubmit="handleRegister(event)">
              <div class="form-group"><label class="form-label">Full Name</label><input class="form-input" id="reg-name" required></div>
              <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" id="reg-email" required></div>
              <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-input" id="reg-password" minlength="6" required></div>
              <button type="submit" class="btn btn--primary btn--full btn--lg">Create Account</button>
            </form>
            <p class="auth-toggle">Already have an account? <a href="#" onclick="toggleAuth(event,'login')">Sign in</a></p>
          </div>
        </div>`;
    }
    function toggleAuth(e, view) { e.preventDefault(); document.getElementById('login-card').style.display = view==='login'?'':'none'; document.getElementById('register-card').style.display = view==='register'?'':'none'; }
    async function handleLogin(e) { e.preventDefault(); const r = await Auth.login(document.getElementById('login-email').value, document.getElementById('login-password').value); if (r.success) { showToast('Welcome back!'); renderProfile(); renderHeader(''); } else showToast(r.message,'error'); }
    async function handleRegister(e) { e.preventDefault(); const r = await Auth.register(document.getElementById('reg-name').value, document.getElementById('reg-email').value, document.getElementById('reg-password').value); if (r.success) { showToast('Account created!'); renderProfile(); renderHeader(''); } else showToast(r.message,'error'); }
    let activeTab = 'profile';
    async function renderProfile() {
      const user = Auth.getCurrentUser();
      const profile = Auth.getProfile() || {};

      // Fetch orders from Supabase
      let orders = [];
      if (user) {
        const { data } = await supabase
          .from('orders')
          .select('*')
          .eq('user_id', user.id)
          .order('created_at', { ascending: false });
        orders = data || [];
      }

      document.getElementById('main-section').innerHTML = `
        <div class="container">
          <div class="account-layout">
            <aside class="account-sidebar">
              <div class="account-sidebar__user">
                <div class="account-sidebar__avatar">${(profile.full_name || 'U').charAt(0).toUpperCase()}</div>
                <div class="account-sidebar__name">${profile.full_name || 'User'}</div>
                <div class="account-sidebar__email">${profile.email || ''}</div>
              </div>
              <nav>
                <a href="#" class="account-nav__link ${activeTab==='profile'?'active':''}" onclick="event.preventDefault();activeTab='profile';renderProfile();"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Profile</a>
                <a href="#" class="account-nav__link ${activeTab==='orders'?'active':''}" onclick="event.preventDefault();activeTab='orders';renderProfile();"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> Orders</a>
                <a href="#" class="account-nav__link" onclick="event.preventDefault();Auth.logout();"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</a>
              </nav>
            </aside>
            <div class="account-content" id="account-content">
              ${activeTab === 'profile' ? `
                <h3 style="margin-bottom:var(--space-6);">Profile Settings</h3>
                <form onsubmit="handleProfileUpdate(event)">
                  <div class="form-group"><label class="form-label">Full Name</label><input class="form-input" id="profile-name" value="${profile.full_name||''}" required></div>
                  <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" id="profile-email" value="${profile.email||''}" required></div>
                  <div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="profile-phone" value="${profile.phone||''}"></div>
                  <div class="form-group"><label class="form-label">Address</label><input class="form-input" id="profile-address" value="${profile.address||''}"></div>
                  <div class="form-row">
                    <div class="form-group"><label class="form-label">City</label><input class="form-input" id="profile-city" value="${profile.city||''}"></div>
                    <div class="form-group"><label class="form-label">ZIP Code</label><input class="form-input" id="profile-zip" value="${profile.zip_code||''}"></div>
                  </div>
                  <div class="form-group"><label class="form-label">Country</label><input class="form-input" id="profile-country" value="${profile.country||''}"></div>
                  <button type="submit" class="btn btn--primary">Save Changes</button>
                </form>
              ` : `
                <h3 style="margin-bottom:var(--space-6);">Order History</h3>
                ${orders.length === 0 ? '<p>No orders yet. <a href="products.html" style="color:var(--color-accent);font-weight:var(--fw-semibold);">Start shopping!</a></p>' : `
                  <div class="table-responsive">
                    <table class="admin-table">
                    <thead><tr><th>Order ID</th><th>Date</th><th>Total</th><th>Status</th><th></th></tr></thead>
                    <tbody>${orders.map(o => `<tr>
                      <td style="font-family:monospace;font-weight:var(--fw-semibold);">${o.order_number}</td>
                      <td>${new Date(o.placed_at||o.created_at).toLocaleDateString()}</td>
                      <td>${formatPrice(parseFloat(o.total))}</td>
                      <td><span class="badge ${o.status==='delivered'?'badge--success':o.status==='shipped'?'badge--warning':'badge--info'}">${o.status}</span></td>
                      <td><a href="order-tracking.html?id=${o.order_number}" class="btn btn--ghost btn--sm">Track</a></td>
                    </tr>`).join('')}</tbody>
                  </table>
                  </div>`}
              `}
            </div>
          </div>
        </div>`;
    }
    async function handleProfileUpdate(e) {
      e.preventDefault();
      const res = await Auth.updateProfile(
        document.getElementById('profile-name').value,
        document.getElementById('profile-email').value,
        document.getElementById('profile-phone').value,
        document.getElementById('profile-address').value,
        document.getElementById('profile-city').value,
        document.getElementById('profile-zip').value,
        document.getElementById('profile-country').value
      );
      if (res.success) { showToast('Profile updated!'); renderProfile(); renderHeader(''); }
      else showToast('Update failed: ' + res.message, 'error');
    }
  </script>
</body>
</html>
