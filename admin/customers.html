<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers — VEERA WEAR Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="admin-root"></div>

  <script src="../js/supabase-cdn.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/app.js"></script>
  <script>
    function toast(msg, type='success') {
      let c = document.querySelector('.toast-container');
      if (!c) { c = document.createElement('div'); c.className = 'toast-container'; document.body.appendChild(c); }
      const t = document.createElement('div');
      t.className = `toast toast--${type}`;
      const icons = { success:'✓', error:'✕', info:'ℹ' };
      t.innerHTML = `<span>${icons[type]||'•'}</span><span>${msg}</span>`;
      c.appendChild(t);
      setTimeout(() => { t.style.opacity='0'; t.style.transition='all 0.3s ease'; }, 2800);
      setTimeout(() => t.remove(), 3200);
    }

    function formatRs(n) { return 'Rs. ' + parseFloat(n||0).toFixed(2); }

    function sidebar() {
      return `
        <aside class="admin-sidebar">
          <div class="admin-sidebar__logo">VEERA<span>WEAR</span> <span class="admin-sidebar__badge">ADMIN</span></div>
          <nav class="admin-nav">
            <div class="admin-nav__section">Main Menu</div>
            <a href="index.html" class="admin-nav__link"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="8" y2="16"/><line x1="16" y1="10" x2="16" y2="16"/></svg></span> Dashboard</a>
            <a href="products.html" class="admin-nav__link"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></span> Products</a>
            <a href="orders.html" class="admin-nav__link"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></span> Orders</a>
            <a href="customers.html" class="admin-nav__link active"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Customers</a>
            <div class="admin-nav__section" style="margin-top:12px;">Account</div>
            <a href="../index.html" class="admin-nav__link" target="_blank"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span> View Shop</a>
            <a href="#" class="admin-nav__link" onclick="AdminAuth.logout();window.location='index.html'"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span> Logout</a>
          </nav>
        </aside>
        <div class="admin-sidebar-overlay" onclick="document.querySelector('.admin-sidebar').classList.remove('open'); this.classList.remove('active');"></div>`;
    }

    async function render(searchTerm = '') {
      const [{ data: profiles }, { data: orders }, { data: subscribers }] = await Promise.all([
        supabase.from('profiles').select('*').order('created_at', { ascending: false }),
        supabase.from('orders').select('user_id, total'),
        supabase.from('newsletter_subscribers').select('email, is_active')
      ]);

      const allProfiles = profiles || [];
      const allOrders = orders || [];
      const allSubs = new Set((subscribers||[]).map(s => s.email));

      // Build per-user spend map
      const spendMap = {};
      allOrders.forEach(o => {
        if (o.user_id) {
          spendMap[o.user_id] = (spendMap[o.user_id] || 0) + parseFloat(o.total || 0);
        }
      });

      let filtered = allProfiles;
      if (searchTerm) filtered = filtered.filter(p =>
        (p.full_name||'').toLowerCase().includes(searchTerm.toLowerCase()) ||
        (p.email||'').toLowerCase().includes(searchTerm.toLowerCase())
      );

      const adminCount = allProfiles.filter(p => p.is_admin).length;

      document.getElementById('admin-root').innerHTML = `
        ${sidebar()}
        <div class="admin-main">
          <div class="admin-topbar">
            <div style="display:flex;align-items:center;">
              <button class="mobile-toggle-btn" onclick="document.querySelector('.admin-sidebar').classList.toggle('open'); document.querySelector('.admin-sidebar-overlay').classList.toggle('active');" aria-label="Toggle Sidebar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
              <div class="admin-topbar__title">Customers (${allProfiles.length})</div>
            </div>
          </div>
          <div class="admin-content">

            <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px;">
              <div class="kpi-card kpi-card--blue" style="padding:14px;">
                <div class="kpi-card__icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
                <div class="kpi-card__label">Total Users</div>
                <div class="kpi-card__value" style="font-size:22px;">${allProfiles.length}</div>
              </div>
              <div class="kpi-card kpi-card--accent" style="padding:14px;">
                <div class="kpi-card__icon">🛡️</div>
                <div class="kpi-card__label">Admins</div>
                <div class="kpi-card__value" style="font-size:22px;">${adminCount}</div>
              </div>
              <div class="kpi-card kpi-card--green" style="padding:14px;">
                <div class="kpi-card__icon">📧</div>
                <div class="kpi-card__label">Subscribers</div>
                <div class="kpi-card__value" style="font-size:22px;">${allSubs.size}</div>
              </div>
            </div>

            <div class="filter-bar">
              <input type="search" class="search-input" placeholder="Search by name or email..." id="search-input"
                value="${searchTerm}" oninput="render(this.value)">
              <span style="color:var(--admin-text-muted);font-size:12px;margin-left:auto;">${filtered.length} customer${filtered.length!==1?'s':''} found</span>
            </div>

            ${filtered.length === 0 ? `
              <div class="empty-state">
                <div class="empty-state__icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
                <div class="empty-state__title">No customers found</div>
                <p>Try adjusting your search.</p>
              </div>` : `
            <div class="table-card">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Customer</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Joined</th>
                    <th>Total Spent</th>
                    <th>Subscribed</th>
                    <th>Role</th>
                  </tr>
                </thead>
                <tbody>
                  ${filtered.map(p => {
                    const initials = (p.full_name || p.email || '?').charAt(0).toUpperCase();
                    const spent = spendMap[p.id] || 0;
                    const isSub = allSubs.has(p.email);
                    return `
                    <tr>
                      <td>
                        <div style="display:flex;align-items:center;gap:10px;">
                          <div style="width:34px;height:34px;border-radius:50%;background:var(--admin-accent);color:#000;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;">${initials}</div>
                          <span style="font-weight:600;">${p.full_name || 'Unknown'}</span>
                        </div>
                      </td>
                      <td style="font-size:13px;">${p.email || '—'}</td>
                      <td style="font-size:13px;">${p.phone || '—'}</td>
                      <td style="font-size:12px;">${new Date(p.created_at).toLocaleDateString('en-IN')}</td>
                      <td style="font-weight:700;color:var(--admin-accent);">${spent > 0 ? formatRs(spent) : '—'}</td>
                      <td>${isSub ? '<span class="abadge abadge--green">✓ Yes</span>' : '<span class="abadge abadge--muted">No</span>'}</td>
                      <td>${p.is_admin ? '<span class="abadge abadge--accent">🛡️ Admin</span>' : '<span class="abadge abadge--muted">Customer</span>'}</td>
                    </tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>`}
          </div>
        </div>`;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();
      const isAdmin = await AdminAuth.isLoggedIn();
      if (!isAdmin) { window.location.href = 'index.html'; return; }
      await render();
    });
  </script>
</body>
</html>
