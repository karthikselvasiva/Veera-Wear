<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — VEERA WEAR</title>
  <meta name="description" content="Review your VEERA WEAR shopping cart and proceed to checkout.">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <section class="page-hero"><div class="page-hero__content"><h1 class="page-hero__title">Shopping Cart</h1></div></section>
  <section class="section">
    <div class="container" id="cart-container"><div style="text-align:center;padding:var(--space-8);"><p>Loading cart...</p></div></div>
  </section>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/supabase-cdn.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => { initApp('', renderCart); });
    window.addEventListener('cart-updated', renderCart);
    async function renderCart() {
      const container = document.getElementById('cart-container');
      const items = await Cart.getItems();
      if (items.length === 0) {
        container.innerHTML = `<div class="cart-empty"><div class="cart-empty__icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></div><h3 class="cart-empty__title">Your Cart is Empty</h3><p>Looks like you haven't added anything yet.</p><a href="products.html" class="btn btn--primary" style="margin-top:var(--space-6);">Start Shopping</a></div>`;
        return;
      }
      const total = await Cart.getTotal();
      const shipping = total >= 999 ? 0 : 99;
      const grandTotal = total + shipping;
      container.innerHTML = `
        <div class="cart-layout">
          <div class="cart-items">
            ${items.map(item => {
              const p = getProductById(item.productId);
              if (!p) return '';
              return `<div class="cart-item">
                <div class="cart-item__image"><img src="${p.image}" alt="${p.name}"></div>
                <div><div class="cart-item__name">${p.name}</div><div class="cart-item__size">Size: ${item.size}</div></div>
                <div class="qty-stepper">
                  <button class="qty-stepper__btn" onclick="Cart.updateQty(${p.id},'${item.size}',${item.qty-1}).then(renderCart)">−</button>
                  <span class="qty-stepper__value">${item.qty}</span>
                  <button class="qty-stepper__btn" onclick="Cart.updateQty(${p.id},'${item.size}',${item.qty+1}).then(renderCart)">+</button>
                </div>
                <div class="cart-item__price">${formatPrice(p.price * item.qty)}</div>
                <button class="cart-item__remove" onclick="Cart.removeItem(${p.id},'${item.size}').then(renderCart)" title="Remove">✕</button>
              </div>`;
            }).join('')}
          </div>
          <div class="cart-summary">
            <h3 class="cart-summary__title">Order Summary</h3>
            <div class="cart-summary__row"><span>Subtotal</span><span>${formatPrice(total)}</span></div>
            <div class="cart-summary__row"><span>Shipping</span><span>${shipping === 0 ? '<span style="color:var(--color-success)">Free</span>' : formatPrice(shipping)}</span></div>
            ${shipping > 0 ? `<div style="font-size:var(--fs-xs);color:var(--color-text-light);padding:var(--space-2) 0;">Free shipping on orders over ₹999</div>` : ''}
            <div class="cart-summary__total"><span>Total</span><span>${formatPrice(grandTotal)}</span></div>
            <a href="checkout.html" class="btn btn--primary btn--full btn--lg" style="margin-top:var(--space-6);">Proceed to Checkout</a>
            <a href="products.html" class="btn btn--ghost btn--full" style="margin-top:var(--space-3);">Continue Shopping</a>
          </div>
        </div>`;
    }
  </script>
</body>
</html>
