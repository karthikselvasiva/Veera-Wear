<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Order — VEERA WEAR</title>
  <meta name="description" content="Track your VEERA WEAR order status in real-time.">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <section class="page-hero"><div class="page-hero__content"><h1 class="page-hero__title">Track Your Order</h1><p class="page-hero__subtitle">Enter your order number to see the latest status</p></div></section>
  <section class="section">
    <div class="container">
      <div class="tracking-form">
        <div class="form-group" style="display:flex;gap:var(--space-3);max-width:500px;margin:0 auto;">
          <input class="form-input" id="track-input" placeholder="Enter your order ID (e.g. AW-...)">
          <button class="btn btn--primary" onclick="trackOrder()">Track</button>
        </div>
      </div>
      <div id="tracking-result" style="margin-top:var(--space-8);"></div>
    </div>
  </section>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/supabase-cdn.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => { 
      initApp('', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');
        if (orderId) {
          document.getElementById('track-input').value = orderId;
          trackOrder();
        }
      }); 
    });
    async function trackOrder() {
      const id = document.getElementById('track-input').value.trim();
      const result = document.getElementById('tracking-result');
      let order = null;

      // Try Supabase first
      if (Auth.isLoggedIn()) {
        const { data } = await supabase
          .from('orders')
          .select('*, order_items(*)')
          .eq('order_number', id)
          .single();
        if (data) {
          order = {
            id: data.order_number,
            date: data.placed_at || data.created_at,
            status: data.status,
            total: parseFloat(data.total),
            email: data.email,
            items: (data.order_items || []).map(oi => ({
              productId: oi.product_id,
              size: oi.size,
              qty: oi.quantity,
              name: oi.product_name,
              image: oi.product_image,
              price: parseFloat(oi.unit_price)
            })),
            steps: buildSteps(data)
          };
        }
      }

      // Fallback: localStorage
      if (!order) {
        const orders = JSON.parse(localStorage.getItem('veerawear_orders')||'[]');
        order = orders.find(o => o.id === id);
      }

      if (!order) { result.innerHTML = `<div style="text-align:center;padding:var(--space-8);"><div style="font-size:3rem;margin-bottom:var(--space-4);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div><h3>Order Not Found</h3><p>We couldn't find an order with that ID. Please check and try again.</p></div>`; return; }
      const icons = ['<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>','<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>','<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>','<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><polyline points="20 6 9 17 4 12"/></svg>'];
      const steps = order.steps || buildSteps(order);
      result.innerHTML = `
        <div style="max-width:700px;margin:0 auto;">
          <div style="background:var(--color-white);border-radius:var(--radius-lg);padding:var(--space-8);box-shadow:var(--shadow-sm);margin-bottom:var(--space-6);">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--space-4);">
              <div><h4>Order ${order.id}</h4><p style="font-size:var(--fs-sm);margin:0;">Placed on ${new Date(order.date).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</p></div>
              <span class="badge badge--info">${order.status.toUpperCase()}</span>
            </div>
          </div>
          <div class="tracking-timeline">
            ${steps.map((step, i) => `
              <div class="tracking-step ${step.done ? 'completed' : ''} ${!step.done && (i===0||steps[i-1].done) ? 'active' : ''}">
                <div class="tracking-step__dot">${step.done ? '✓' : icons[i]}</div>
                <div><div class="tracking-step__title">${step.name}</div><div class="tracking-step__date">${step.done && step.date ? new Date(step.date).toLocaleDateString() : (step.done ? 'Completed' : 'Pending')}</div></div>
              </div>`).join('')}
          </div>
          <div style="background:var(--color-white);border-radius:var(--radius-lg);padding:var(--space-6);box-shadow:var(--shadow-sm);">
            <h4 style="margin-bottom:var(--space-4);">Order Items</h4>
            ${order.items.map(i=>{const p=getProductById(i.productId)||i;return `<div style="display:flex;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--color-border);align-items:center;"><img src="${p.image}" style="width:50px;height:60px;object-fit:cover;border-radius:var(--radius-sm);"><div style="flex:1;"><div style="font-size:var(--fs-sm);font-weight:var(--fw-semibold);">${p.name}</div><div style="font-size:var(--fs-xs);color:var(--color-text-light);">Size: ${i.size} × ${i.qty}</div></div><div style="font-weight:var(--fw-bold);">${formatPrice((p.price||i.price)*i.qty)}</div></div>`;}).join('')}
            <div style="display:flex;justify-content:space-between;padding-top:var(--space-4);font-weight:var(--fw-bold);font-size:var(--fs-lg);"><span>Total</span><span>${formatPrice(order.total)}</span></div>
          </div>
        </div>`;
    }
    function buildSteps(o) {
      return [
        { name: 'Order Placed', date: o.placed_at || o.date || o.created_at, done: true },
        { name: 'Processing', date: o.status !== 'processing' ? (o.placed_at || o.created_at) : '', done: ['processing','shipped','delivered'].includes(o.status) },
        { name: 'Shipped', date: o.shipped_at || '', done: ['shipped','delivered'].includes(o.status) },
        { name: 'Delivered', date: o.delivered_at || '', done: o.status === 'delivered' }
      ];
    }
  </script>
</body>
</html>
