<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — VEERA WEAR</title>
  <meta name="description" content="Shop premium fashion at VEERA WEAR. Explore detailed product views, reviews, and size guides.">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <section class="section">
    <div class="container">
      <nav class="breadcrumb" id="breadcrumb"></nav>
      <div class="product-detail" id="product-detail"></div>
    </div>
  </section>
  <section class="section section--alt" id="related-section" style="display:none;">
    <div class="container text-center">
      <span class="section-label">You May Also Like</span>
      <h2 class="section-title">Related Products</h2>
      <div class="grid grid--products stagger" id="related-grid" style="margin-top:var(--space-8);"></div>
    </div>
  </section>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/supabase-cdn.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    let selectedSize = null;
    document.addEventListener('DOMContentLoaded', () => {
      initApp('', async () => {
        const id = new URLSearchParams(window.location.search).get('id');
        const product = getProductById(id);
        if (!product) { document.getElementById('product-detail').innerHTML = '<div class="cart-empty"><div class="cart-empty__icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:text-bottom"><circle cx="12" cy="12" r="10"/><path d="M8 15h8"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></div><h3>Product Not Found</h3><p>The product you are looking for does not exist.</p><a href="products.html" class="btn btn--primary" style="margin-top:var(--space-4);">Browse Products</a></div>'; return; }
        document.title = product.name + ' — VEERA WEAR';
        document.getElementById('breadcrumb').innerHTML = `<a href="index.html">Home</a><span class="breadcrumb__sep">/</span><a href="products.html?category=${product.category}">${product.category.charAt(0).toUpperCase()+product.category.slice(1)}</a><span class="breadcrumb__sep">/</span><span>${product.name}</span>`;
        const reviews = await getProductReviews(product.id);
        const actualReviewCount = reviews.length;
        const actualRating = actualReviewCount > 0 
          ? (reviews.reduce((sum, r) => sum + r.rating, 0) / actualReviewCount).toFixed(1)
          : (product.rating ? parseFloat(product.rating).toFixed(1) : '0.0');

        selectedSize = product.sizes[1] || product.sizes[0];
        document.getElementById('product-detail').innerHTML = `
          <div class="product-gallery">
            <div class="product-gallery__main"><img src="${product.images[0]}" alt="${product.name}" id="main-image"></div>
            <div class="product-gallery__thumbs">${product.images.map((img,i) => `<div class="product-gallery__thumb ${i===0?'active':''}" onclick="changeImage('${img}',this)"><img src="${img}" alt="View ${i+1}"></div>`).join('')}</div>
          </div>
          <div class="product-info">
            <div class="product-info__category">${product.category}</div>
            <h1 class="product-info__name">${product.name}</h1>
            <div class="product-info__price-row">
              <span class="product-info__price">${formatPrice(product.price)}</span>
              ${product.oldPrice ? `<span class="product-info__price--old">${formatPrice(product.oldPrice)}</span>` : ''}
            </div>
            <div class="product-info__rating">
              <span class="stars">${renderStars(actualRating)}</span>
              <span style="font-size:var(--fs-sm);color:var(--color-text-light);">${actualRating} (${actualReviewCount} reviews)</span>
            </div>
            <p class="product-info__desc">${product.description}</p>
            <div class="size-selector">
              <span class="size-selector__label">Size</span>
              <div class="size-options">${product.sizes.map(s => `<button class="size-option ${s===selectedSize?'active':''}" onclick="selectSize('${s}',this)">${s}</button>`).join('')}</div>
            </div>
            <div class="add-to-cart-row">
              <div class="qty-stepper">
                <button class="qty-stepper__btn" onclick="changeQty(-1)">−</button>
                <span class="qty-stepper__value" id="qty-value">1</span>
                <button class="qty-stepper__btn" onclick="changeQty(1)">+</button>
              </div>
              <button class="btn btn--primary btn--lg" onclick="addProductToCart(${product.id})" style="flex:1;">Add to Cart</button>
            </div>
            <div class="product-features">
              <div class="product-feature"><span class="product-feature__icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span><span>Free Shipping over ₹999</span></div>
              <div class="product-feature"><span class="product-feature__icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg></span><span>30-Day Returns</span></div>
              <div class="product-feature"><span class="product-feature__icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:text-bottom"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span><span>Secure Checkout</span></div>
            </div>
            <div class="tabs">
              <button class="tab-btn active" onclick="switchTab('desc',this)">Description</button>
              <button class="tab-btn" onclick="switchTab('reviews',this)">Reviews (${reviews.length})</button>
              <button class="tab-btn" onclick="switchTab('shipping',this)">Shipping</button>
            </div>
            <div class="tab-panel active" id="tab-desc"><p>${product.description}</p></div>
            <div class="tab-panel" id="tab-reviews">
              <div id="reviews-list">${reviews.map(r => `<div class="review-card"><div class="review-card__header"><div class="review-card__avatar">${r.author.charAt(0)}</div><div><div class="review-card__author">${r.author}</div><div class="stars" style="font-size:var(--fs-xs);">${renderStars(r.rating)}</div></div><span class="review-card__date">${r.date}</span></div><p class="review-card__body">${r.text}</p></div>`).join('')}</div>
              <div style="margin-top:var(--space-6);border-top:1px solid var(--color-border);padding-top:var(--space-6);">
                <h4 style="margin-bottom:var(--space-4);">Write a Review</h4>
                <form onsubmit="submitReview(event,${product.id})">
                  <div class="form-group"><input class="form-input" id="review-author" placeholder="Your name" required></div>
                  <div class="form-group"><select class="form-select" id="review-rating"><option value="5">★★★★★ (5)</option><option value="4">★★★★ (4)</option><option value="3">★★★ (3)</option><option value="2">★★ (2)</option><option value="1">★ (1)</option></select></div>
                  <div class="form-group"><textarea class="form-input" id="review-text" placeholder="Share your experience..." required></textarea></div>
                  <button type="submit" class="btn btn--secondary">Submit Review</button>
                </form>
              </div>
            </div>
            <div class="tab-panel" id="tab-shipping"><p>We offer free standard shipping on all orders over ₹999. Standard delivery takes 3–5 business days. Express shipping (1–2 business days) is available at checkout for ₹99.</p><p>We also offer express delivery across India. Delivery times vary by location.</p></div>
          </div>`;
        // Related products
        const related = getRelatedProducts(product);
        if (related.length > 0) { document.getElementById('related-section').style.display=''; document.getElementById('related-grid').innerHTML = related.map(p => renderProductCard(p)).join(''); }

        // JSON-LD
        const ld = document.createElement('script'); ld.type='application/ld+json';
        ld.textContent = JSON.stringify({"@context":"https://schema.org","@type":"Product","name":product.name,"description":product.description,"image":product.image,"offers":{"@type":"Offer","price":product.price,"priceCurrency":"INR","availability":"https://schema.org/InStock"},"aggregateRating":{"@type":"AggregateRating","ratingValue":product.rating,"reviewCount":product.reviews}});
        document.head.appendChild(ld);
      });
    });
    function changeImage(src, el) { document.getElementById('main-image').src=src; document.querySelectorAll('.product-gallery__thumb').forEach(t=>t.classList.remove('active')); el.classList.add('active'); }
    function selectSize(s, el) { selectedSize=s; document.querySelectorAll('.size-option').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }
    function changeQty(d) { const el=document.getElementById('qty-value'); el.textContent=Math.max(1,parseInt(el.textContent)+d); }
    function addProductToCart(id) { if(!selectedSize){showToast('Please select a size','error');return;} const qty=parseInt(document.getElementById('qty-value').textContent); Cart.addItem(id,selectedSize,qty); }
    function switchTab(tab,btn) { document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); document.getElementById('tab-'+tab).classList.add('active'); btn.classList.add('active'); }
    async function submitReview(e,pid) { e.preventDefault(); const author=document.getElementById('review-author').value; const rating=document.getElementById('review-rating').value; const text=document.getElementById('review-text').value; await submitReviewToSupabase(pid,author,rating,text); showToast('Review submitted!'); location.reload(); }
  </script>
</body>
</html>
